name: HRVCompanion
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
targets:
  HRVCompanion:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.hrvcompanion
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 心息
        INFOPLIST_KEY_NSHealthShareUsageDescription: 读取心率变异性，向你展示最新 HRV 和最近七天的记录。数据不会上传。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_ENTITLEMENTS: Sources/HRVCompanion.entitlements
    dependencies:
      - sdk: HealthKit.framework
schemes:
  HRVCompanion:
    build:
      targets:
        HRVCompanion: all
